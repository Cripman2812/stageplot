name: iOS Build

on:
  push:
    branches: [ main ]
  workflow_dispatch: {}

jobs:
  build-ios-simulator:
    runs-on: macos-14

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install web dependencies
        run: npm install @capacitor/ios@^7.4.3

      - name: Build web app (vite)
        run: npm run build

      - name: Ensure native iOS project exists
        run: |
          if [ ! -d "ios/App" ]; then
            echo "No real native iOS project found yet -- creating it."
            rm -rf ios
            npx cap add ios
          else
            echo "Native iOS project already present."
          fi

      - name: Sync web build into native project
        run: npx cap sync ios

      - name: Install CocoaPods dependencies
        working-directory: ios/App
        run: pod install

      - name: Build for iOS Simulator (unsigned)
        working-directory: ios/App
        run: |
          xcodebuild -workspace App.xcworkspace \
            -scheme App \
            -configuration Debug \
            -sdk iphonesimulator \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Upload .app artifact
        uses: actions/upload-artifact@v4
        with:
          name: stageforge-ios-simulator-app
          path: ios/App/build/Build/Products/Debug-iphonesimulator/App.app
          if-no-files-found: error
